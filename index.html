<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Web de Farmacia - Inicio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #064e3b 0%, #0f172a 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 2.3rem;
            color: #34d399;
            margin-bottom: 10px;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(52, 211, 153, 0.3);
        }
        .subtitle {
            font-size: 1.1rem;
            color: #cbd5e1;
            margin-bottom: 25px;
        }
        .team-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid rgba(52, 211, 153, 0.2);
        }
        .team-box h3 {
            color: #6ee7b7;
            font-size: 0.95rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .team-box p {
            color: #f8fafc;
            font-size: 1rem;
            margin: 4px 0;
        }
        .pharmacy-img {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid rgba(52, 211, 153, 0.3);
            margin-bottom: 25px;
        }
        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .btn-nav {
            background-color: #059669;
            color: #ffffff;
            padding: 12px 25px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 15px rgba(5, 150, 105, 0.4);
        }
        .btn-nav:hover {
            background-color: #047857;
            transform: translateY(-2px);
        }
        footer {
            text-align: center;
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Título principal resaltado del proyecto -->
        <h1>Sistema Web de Farmacia</h1>
        <p class="subtitle">Documentación oficial de procesos y reglas de negocio institucionales</p>

        <!-- Sección de integrantes del equipo -->
        <div class="team-box">
            <h3>Integrantes del Equipo</h3>
            <p>Zero</p>
            <p>Asmat Cortez Nacir Alexander</p>
        </div>

        <!-- Imagen representativa de la farmacia -->
        <img src="https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?auto=format&fit=crop&w=800&q=80" alt="Farmacia" class="pharmacy-img">

        <!-- Menú de navegación que dirige a las demás páginas -->
        <nav>
            <a href="procesos.html" class="btn-nav">Procesos de negocio</a>
            <a href="reglas.html" class="btn-nav">Reglas de negocio</a>
        </nav>
    </div>

    <footer>
        <p>&copy; 2026 Sistema Web de Farmacia - Todos los derechos reservados</p>
    </footer>

</body>
</html>
